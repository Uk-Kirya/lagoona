<!DOCTYPE html>
<html lang="ru">

{% load static %}

<head>

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=4">

    <script type="application/ld+json">{% block schema %}{% endblock %}</script>

    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph (для Facebook, Instagram и мессенджеров) -->
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ url }}">
    <meta property="og:image" content="{{ url }}/static/img/logo.svg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    <meta name="twitter:image" content="{{ url }}/static/img/logo.svg">

<body class="d-flex flex-column vh-100">
    {% include 'includes/header.html' %}

    <div class="call__button">
        <a href="tel:+79180069131">
            <picture>
                <img src="{% static 'img/call.svg' %}" alt="">
            </picture>
        </a>
    </div>

    {% block content %}{% endblock %}

    {% include 'includes/footer.html' %}
    {% include 'includes/modals.html' %}
    {% include 'includes/scripts.html' %}
</body>

</html>
